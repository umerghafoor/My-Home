<!DOCTYPE html>
<html lang="us">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="icon" href="Icons/icons8-home-50.svg" />
  </head>

  <body>
    <div class="sidebar-wrapper">
      <div class="sidebar">
        <div class="buttons">
          <input type="checkbox" id="chb_theme" />
          <label class="btn_theme" for="chb_theme"></label>
          <input type="checkbox" id="chb_header" />
          <label class="btn_header" for="chb_header"></label>
          <input type="checkbox" id="chb_menu" />
          <label class="btn_menu" for="chb_menu"></label>
        </div>
        <div class="sidebar__settings">
          <h3>Weather</h3>
          <h4>API</h4>
          <input class="sidebar__input" type="text" placeholder="Enter key" id="key" autocomplete="off" />
          <h4>City</h4>
          <input class="sidebar__input" type="text" placeholder="Enter city" id="city" />
          <div class="sidebar__radio">
            <label class="control control-radio">
              &deg;C
              <input type="radio" name="temp_unit" id="celsius" />
              <div class="control__indicator"></div>
            </label>
            <label class="control control-radio">
              &deg;F
              <input type="radio" name="temp_unit" id="fahrenheit" />
              <div class="control__indicator"></div>
            </label>
          </div>
          <button class="sidebar__button" id="weather_apply">Apply</button>
        </div>
        <div class="sidebar__settings">
          <h3>Greeting</h3>
          <h4>Name</h4>
          <input class="sidebar__input" type="text" id="greeting_name" name="name_field" />
          <button class="sidebar__button" id="name_apply">Apply</button>
        </div>
        <div class="sidebar__settings">
          <h3>Theme</h3>
          <h4>Background</h4>
          <input type="color" id="bg_input" />
          <h4>Foreground</h4>
          <input type="color" id="fg_input" />
          <h4>Accent</h4>
          <input type="color" id="accent_input" />
          <div class="sidebar__button-container">
            <button class="sidebar__button" id="color_apply">Apply</button>
            <button class="sidebar__button" id="color_reset">Reset</button>
          </div>
        </div>
        <!-- Popup form for adding custom links -->
        <div id="link-form-popup" class="popup-form" style="display: none">
          <h3>Add New Link</h3>
          <input type="text" id="custom-link-url" placeholder="Enter URL"
            onfocus="document.getElementById('searchInput').disabled=true;"
            onblur="document.getElementById('searchInput').disabled=false;" />
          <input type="text" id="custom-link-name" placeholder="Enter link name"
            onfocus="document.getElementById('searchInput').disabled=true;"
            onblur="document.getElementById('searchInput').disabled=false;" />
          <input type="text" id="custom-link-icon" placeholder="Icon path (optional)"
            onfocus="document.getElementById('searchInput').disabled=true;"
            onblur="document.getElementById('searchInput').disabled=false;" />
          <div class="file-input-container">
            <label for="import-file" class="file-input-button">Import Links from File</label>
            <input type="file" id="import-file" class="file-input" accept=".json" />
            <div id="file-name" class="file-name"></div>
          </div>
          <div class="import-export-buttons">
            <button id="export-links">Export Links</button>
            <button id="add-custom-link">Add Link</button>
            <button id="close-link-form">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="header">
        <h1 class="header__greeting">
          Umer, <span class="header__greeting-name">Ghafoor</span>.
        </h1>
        <div class="header__weather">
          <p id="header__weather-alert"></p>
          <p id="header__weather-info"></p>
        </div>
      </div>

      <!-- ── Material Expressive Search ── -->
      <div class="search-wrapper">

        <!-- Row: bouncing pill + round submit -->
        <div class="search-row">

          <form id="searchForm" action="https://www.google.com/search" method="get" target="_self"
                style="display:contents;">

            <!-- Collapsible pill -->
            <div class="search-pill" id="searchPill">

              <!-- Click-to-expand icon -->
              <div class="search-pill-icon" id="pillIcon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="7"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              </div>

              <input
                type="text"
                class="search-input"
                id="searchInput"
                name="q"
                autocomplete="off"
                placeholder="Search the web..."
              />

              <!-- Clear × -->
              <button type="button" class="search-clear-btn" id="clearBtn" title="Clear">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round">
                  <line x1="18" y1="6" x2="6" y2="18"/>
                  <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>

            </div>

            <!-- Always-visible round submit -->
            <button type="submit" class="search-submit-btn" id="submitBtn" title="Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
          
          <div class="engine-row" id="engineRow"></div>
          
          </form>
        </div>

        <!-- Suggestions Dropdown -->
        <div class="suggestions-box" id="suggestionsBox">
          <div class="suggestions-list" id="suggestionsList"></div>
          <div class="suggestions-hint">
            <span><kbd>↑↓</kbd> navigate</span>
            <span><kbd>↵</kbd> search</span>
            <span><kbd>Esc</kbd> close</span>
          </div>
        </div>

        <!-- Engine pills below the row -->

      </div>
      <!-- ── end search ── -->
